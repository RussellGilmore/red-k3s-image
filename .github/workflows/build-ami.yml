name: Build k3s AMI

on:
  push:
    tags:
      - "v*"
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.PACKER_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: latest
      - name: Packer Init
        run: packer init .
      - name: Packer Validate
        run: |
          packer validate \
            -var "region=${{ secrets.AWS_REGION }}" \
            -var "vpc_id=${{ secrets.PACKER_VPC_ID }}" \
            -var "subnet_id=${{ secrets.PACKER_SUBNET_ID }}" \
            -var "iam_instance_profile=PackerBuildRole" \
            .
      - name: Packer Build
        run: |
          packer build \
            -var "region=${{ secrets.AWS_REGION }}" \
            -var "vpc_id=${{ secrets.PACKER_VPC_ID }}" \
            -var "subnet_id=${{ secrets.PACKER_SUBNET_ID }}" \
            -var "iam_instance_profile=PackerBuildRole" \
            .
